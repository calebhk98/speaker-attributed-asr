name: CI

# Fast, weight-free checks on every push and PR. The heavy `slow` tests
# (weight downloads / GPU) are intentionally excluded here.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Format check
        run: ruff format --check src tests

      - name: Type-check
        run: mypy

      - name: Test (fast)
        run: pytest -q -m "not slow"
